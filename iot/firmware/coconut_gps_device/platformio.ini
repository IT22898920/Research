; PlatformIO Configuration for Coconut GPS IoT Device
; ===================================================
; Use this if you prefer VSCode + PlatformIO over Arduino IDE
;
; Setup:
; 1. Install "PlatformIO IDE" extension in VSCode
; 2. Open this folder as PlatformIO project
; 3. Edit config.h with your WiFi & device credentials
; 4. Click Upload (arrow icon in bottom toolbar)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor
monitor_speed = 115200

; Upload speed
upload_speed = 921600

; Libraries
lib_deps =
    mikalhart/TinyGPSPlus@^1.1.0
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    bblanchon/ArduinoJson@^7.0.0
